<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JCL Trendy Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeeeec;--panel:#f8f8f6;--line:#d9d9d6;--text:#2a2a29;--mute:#85857f;
--font:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color-scheme:light;box-sizing:border-box}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:300 .97rem/1.65 var(--font);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--text);outline-offset:4px}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(1.25rem,3vw,2.5rem)}

/* header sits on top of the full-screen hero */
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
padding:calc(1rem + env(safe-area-inset-top,0px)) clamp(1.25rem,2.5vw,2.25rem) 1rem;
background:linear-gradient(rgba(238,238,236,.85),transparent);transition:background .25s}
header.solid{background:rgba(238,238,236,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.left,.right{display:flex;align-items:center;gap:clamp(1rem,2.2vw,2.25rem);font-weight:400;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.logo{display:block;line-height:1;margin-right:.5rem}
.logo img{display:block;height:2.9rem;width:auto;filter:invert(1)}
.logo b{display:block;font-size:1.55rem;font-weight:700;letter-spacing:-.03em}
.logo small{font-size:.55rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
header nav{display:flex;gap:clamp(1rem,2.2vw,2.25rem)}
header a[aria-current=page]{border-bottom:1px solid var(--text);padding-bottom:.2rem}
@media (max-width:760px){header{flex-wrap:wrap;row-gap:.6rem}header nav{order:3;width:100%;overflow-x:auto}.logo small{display:none}}

/* full-screen hero */
.hero{position:relative;height:100vh;height:100svh;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
text-align:center;padding:0 1.25rem 4.5rem;overflow:hidden;background:var(--g)}
.hero svg{position:absolute;left:50%;top:50%;width:min(130vmin,1100px);transform:translate(-50%,-52%);fill:rgba(0,0,0,.055)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(238,238,236,.75))}
.hero h1,.hero button{position:relative;z-index:1}

.hero h1{font-weight:200;font-size:clamp(2.1rem,6vw,4.4rem);line-height:1.1;letter-spacing:-.025em;margin:0 0 1.1rem;max-width:18ch}
.go{font-weight:400;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;display:inline-flex;gap:.6rem;align-items:center}
.go:hover{text-decoration:underline;text-underline-offset:5px}

section{padding:clamp(3rem,7vw,5.5rem) 0}
.title{font-weight:300;font-size:clamp(1.4rem,2.6vw,1.95rem);letter-spacing:-.01em;margin:0 0 1.75rem}
.shead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.5rem}
.shead .title{margin:0}
.see{font-weight:400;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.see:hover{text-decoration:underline;text-underline-offset:5px}
.car{position:relative}
.track{display:flex;gap:1.25rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 calc((100% - 3.75rem)/4);scroll-snap-align:start;min-width:0}
@media (max-width:900px){.card{flex-basis:calc((100% - 1.25rem)/2)}}
@media (max-width:520px){.card{flex-basis:78%}}
.pic{position:relative;aspect-ratio:2/3;background:#e3e3e0;display:grid;place-items:center}
.pic svg.p{width:62%}
.heart{position:absolute;top:.9rem;right:.9rem;width:1.6rem;height:1.6rem;color:#222}
.heart svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2}
.heart[aria-pressed=true] svg{fill:currentColor}
.nm{font-weight:400;font-size:.9rem;letter-spacing:.04em;margin-top:.85rem}
.vr,.pr{color:var(--mute);font-size:.85rem;line-height:1.5}
.add{color:var(--mute);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;margin-top:.5rem}
.arrow{position:absolute;top:calc(50% - 4rem);z-index:2;width:3rem;height:3rem;border-radius:50%;background:#fff;color:var(--text);font-size:1.1rem;display:grid;place-items:center;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.arrow[hidden]{display:none}
.arrow.prev{left:-.6rem}
.arrow.next{right:-.6rem}
.add:hover{color:var(--text);text-decoration:underline;text-underline-offset:4px}
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.stores div{background:var(--panel);padding:2rem}
.stores b{display:block;font-size:1.05rem;font-weight:400;margin-bottom:.4rem}
.stores p{margin:0;color:var(--mute)}

.news{border-top:1px solid var(--line)}
section.photo-sec{position:relative;isolation:isolate;overflow:hidden;--mute:#45443f;padding:clamp(4.5rem,9vw,7.5rem) 0}
section.photo-sec::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;

.news form{display:flex;gap:1.5rem;border-bottom:1px solid var(--text);max-width:440px}
.news input{flex:1;background:none;border:0;color:var(--text);font:inherit;padding:.6rem 0}
.news input:focus-visible{outline:none}
.news form button{font-weight:400;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
#msg{margin-top:.8rem;min-height:1.5em;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:2rem 0;color:var(--mute);font-size:.8rem;letter-spacing:.06em}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
footer nav{display:flex;gap:1.5rem}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:translate(-50%,-52%) scale(.8)}to{opacity:1;transform:translate(-50%,-52%) scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.25)}}
body{animation:fade .8s both}
header{animation:drop .7s cubic-bezier(.2,.8,.2,1) both}
main.enter>.hero:first-child svg{animation:zoom 1.4s cubic-bezier(.2,.8,.2,1) both}
main.enter>.hero:first-child h1{animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both}
main.enter>.hero:first-child .go{animation:rise .9s .45s cubic-bezier(.2,.8,.2,1) both}
.rv{opacity:0;transform:translateY(36px);transition:opacity .8s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .8s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}
.pic{overflow:hidden}
.pic svg.p{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .pic svg.p{transform:scale(1.08) rotate(-2deg)}
.arrow{transition:transform .2s}
.arrow:hover{transform:scale(1.1)}
button:active{transform:scale(.94)}
.heart.pop svg{animation:pop .45s}
#bag.bump{animation:bump .45s}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.cats a{display:block;background:var(--panel);padding:2.5rem 2rem;border:1px solid var(--line)}
.cats a:hover{border-color:var(--text)}
.cats b{display:block;font-size:1.4rem;font-weight:300;margin-bottom:.4rem}
.cats p{margin:0;color:var(--mute)}
.add:disabled{opacity:.45;cursor:not-allowed;text-decoration:none}
.stock{display:inline-block;margin-top:.5rem;font-size:.72rem;font-weight:400;letter-spacing:.06em;padding:.2rem .7rem;border:1px solid var(--line);border-radius:99px}
.stock.low{color:#8f7a45;border-color:#c9b98f}
.stock.out{color:var(--mute)}
.pl{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
@media (max-width:900px){.pl{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.pl{grid-template-columns:1fr}}
.box{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.box .pic{aspect-ratio:1/1.05;background:#fcfcfb;border-bottom:1px solid var(--line)}
.box .pic svg.p{width:72%}
.box .heart{top:auto;bottom:1rem;right:1rem}
.eye{position:absolute;top:1rem;left:1rem;z-index:2;width:3.1rem;height:3.1rem;display:grid;place-items:center;background:#fff;color:var(--text)}
.eye svg{width:1.3rem;fill:none;stroke:currentColor;stroke-width:2}
.badge{position:absolute;top:1.1rem;right:0;z-index:2;background:var(--text);color:#f4f4f2;font-size:.64rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;padding:.35rem .7rem}
.qv{position:absolute;left:0;right:0;bottom:0;z-index:1;background:rgba(250,250,248,.95);color:var(--text);padding:1rem 1.25rem;font-size:.85rem;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .35s}
.qv.open{transform:none}
.info{padding:1.5rem 1.5rem 1.75rem}
.sw{display:inline-block;width:1.5rem;height:1.5rem;border-radius:50%;margin:3px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--text)}
.box .nm{font-size:.95rem;font-weight:400;text-transform:uppercase;letter-spacing:.1em;line-height:1.4;margin:1rem 0 .5rem}
.box .pr{color:var(--text)}
.box .add{margin-top:.7rem;font-weight:400;color:var(--text)}
.ov{position:fixed;inset:0;background:rgba(60,60,58,.28);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.ov.open{opacity:1;pointer-events:auto}
.cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);z-index:50;transform:translateX(100%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.cart.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:1.1rem;font-weight:300;letter-spacing:.1em;text-transform:uppercase}
#cx{font-size:1.2rem;padding:.3rem .5rem}
.cl{flex:1;overflow-y:auto;padding:0 1.5rem}
.empty{color:var(--mute);padding:2rem 0}
.ci{display:grid;grid-template-columns:4.5rem 1fr auto;gap:1rem;padding:1.1rem 0;border-bottom:1px solid var(--line);animation:rise .4s both}
.cth{background:#fcfcfb;aspect-ratio:1;display:grid;place-items:center}
.cth svg{width:72%}
.cd b{display:block;font-size:.9rem;font-weight:400}
.cd>span{display:block;color:var(--mute);font-size:.82rem;margin-top:.1rem}
.qty{display:flex;align-items:center;gap:.7rem;margin-top:.6rem}
.qty button{width:1.8rem;height:1.8rem;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.qty button:hover{border-color:var(--text)}
.cp{text-align:right;font-weight:400;font-size:.9rem}
.rm{display:block;margin:.6rem 0 0 auto;font-size:.75rem;font-weight:300;color:var(--mute);text-decoration:underline}
.cf{padding:1.25rem 1.5rem calc(1.25rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sub{display:flex;justify-content:space-between;margin-bottom:1rem;font-size:.95rem}
.chk{width:100%;background:var(--text);color:#f4f4f2;padding:1rem;font-weight:400;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
#cmsg{min-height:1.5em;margin:.8rem 0 0;color:var(--mute)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}

.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.heart{z-index:2}
.stores p{white-space:pre-line}
footer nav button{font-size:inherit;color:inherit;opacity:.6;letter-spacing:inherit}
footer nav button:hover{opacity:1;text-decoration:underline}
.ed{outline:1px dashed rgba(42,42,41,.5);outline-offset:3px;cursor:text;min-width:2ch}
.ed:hover{background:rgba(255,235,120,.35)}
.ed:focus{outline:2px solid #2a2a29;background:#fff;color:#2a2a29}
.adm{display:none;position:absolute;left:.6rem;right:.6rem;bottom:.6rem;z-index:3;gap:.35rem;flex-wrap:wrap;align-items:center}
.admin .adm{display:flex}
.box .adm{right:3.4rem}
.adm button,.adm label{background:#2a2a29;color:#fff;font-size:.68rem;letter-spacing:.05em;padding:.4rem .6rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.adm .ab-x{background:#8a3b34;margin-left:auto}
.adm input[type=color]{width:1.3rem;height:1.1rem;border:0;padding:0;background:none;cursor:pointer}
.adm input[type=number]{width:3rem;font:inherit;padding:.1rem .2rem;border:0}
.admin .logo{outline:1px dashed #2a2a29;outline-offset:4px;cursor:pointer}
body.admin{padding-bottom:7.5rem}
/* hero photo background */
.hero.hasbg{background-size:cover;background-position:center;background-repeat:no-repeat}
.hero.hasbg svg{display:none}
.hero.hasbg::after{background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.55))}
.hero.hasbg h1,.hero.hasbg .go{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hbar{display:none;position:absolute;top:5.2rem;right:1rem;z-index:5;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.admin .hbar{display:flex;animation:rise .6s .5s cubic-bezier(.2,.8,.2,1) both}
.hbar button{background:#2a2a29;color:#fff;font-size:.72rem;letter-spacing:.05em;padding:.55rem .9rem;cursor:pointer;border:1px solid #6d6d69}
.hbar button:hover{background:#44443f}
/* account / login */
.hero.compact{height:46vh;min-height:340px;padding-bottom:3rem}
#acct{white-space:nowrap}
.login{max-width:440px;margin:0 auto;text-align:center}
.login p{color:var(--mute);font-size:.9rem;line-height:1.6}
.login .fine,.lset .fine{font-size:.75rem;line-height:1.6}
.sso{display:flex;align-items:center;justify-content:center;gap:.8rem;width:100%;padding:.95rem 1rem;border:1px solid var(--text);background:var(--panel);color:var(--text);font-size:.82rem;letter-spacing:.08em;margin:.6rem 0;cursor:pointer;text-transform:uppercase}
.sso:hover{background:var(--text);color:#fff}
.sso svg{width:1.3rem;height:1.3rem;flex:none}
.lmsg{min-height:1.4em;font-size:.85rem;margin:.6rem 0;color:#8a3b34}
.me{display:flex;align-items:center;gap:1.2rem;padding:1.4rem;border:1px solid var(--line);background:var(--panel);text-align:left;margin-bottom:1rem}
.me .av{width:4rem;height:4rem;border-radius:50%;object-fit:cover;background:#2a2a29;color:#fff;display:grid;place-items:center;font-size:1.5rem;flex:none}
.me .mu{color:var(--mute);font-size:.85rem;margin-top:.15rem;word-break:break-all}
.lset{display:none}
.admin .lset{display:block;max-width:640px;margin:3rem auto 0;padding:1.5rem;border:1px dashed #8d8d88;animation:rise .55s .55s cubic-bezier(.2,.8,.2,1) both}

.lset label{display:block;font-size:.8rem;margin:.8rem 0}
.lset input{display:block;width:100%;box-sizing:border-box;margin-top:.3rem;padding:.6rem;border:1px solid var(--line);background:#fff;font:inherit;font-size:.85rem}

.szr{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin:.4rem 0;font-size:.8rem;color:var(--mute)}
.szr>span{margin-right:.2rem}
.chip{min-width:2rem;padding:.2rem .5rem;border:1px solid var(--line);font-size:.75rem;color:var(--text);background:transparent;cursor:pointer;line-height:1.4}
.chip.on{border-color:var(--text);background:var(--text);color:#fff}
.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.szadm{display:none}
.admin .szadm{display:block;margin:.5rem 0}
.admin .szr{display:none}
.sar{display:flex;align-items:center;gap:.3rem;margin:.25rem 0}
.sar .sl{min-width:3.2rem;padding:.2rem .4rem;border:1px dashed var(--text);font-size:.8rem;outline:0}
.sar button{width:1.55rem;height:1.55rem;background:#2a2a29;color:#fff;font-size:1rem;line-height:1;display:grid;place-items:center}
.sar b{min-width:1.6rem;text-align:center;font-weight:500;font-size:.85rem}
.sar .sx{background:#8a3b34;margin-left:.3rem}
.sadd{margin-top:.35rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1px dashed #8d8d88;padding:.35rem .7rem;color:var(--text)}
.sadd:hover{border-color:var(--text);background:rgba(255,255,255,.5)}
.photo-sec .card .szr,.photo-sec .card .szadm{margin-left:1rem;margin-right:1rem}
/* size line + add-product tile */
.sz{color:var(--mute);font-size:.85rem;line-height:1.5}
.box .sz{color:var(--mute);margin:-.2rem 0 .3rem}
.addtile{display:none}
.admin .addtile{display:flex;align-items:center;justify-content:center;min-height:16rem;animation:rise .55s .55s cubic-bezier(.2,.8,.2,1) both}
.addtile button{display:flex;flex-direction:column;align-items:center;gap:.4rem;width:calc(100% - 2rem);height:calc(100% - 2rem);min-height:13rem;border:2px dashed #8d8d88;background:transparent;color:var(--text);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;justify-content:center;cursor:pointer}
.addtile button b{font-size:2.6rem;font-weight:200;line-height:1}
.addtile button:hover{background:rgba(255,255,255,.5);border-color:var(--text)}
.photo-sec .addtile{background:rgba(250,250,248,.7);border:1px dashed var(--line)}
/* transparent product backgrounds */
.pic,.box,.box .pic,.info{background:transparent}
/* home page: cards sit on the photo, so give them a solid card background */
.photo-sec .card{background:rgba(250,250,248,.94);border:1px solid var(--line);padding-bottom:1rem}
.photo-sec .card .pic{background:#e9e9e6}
.photo-sec .card .nm,.photo-sec .card .vr,.photo-sec .card .pr,.photo-sec .card .add{margin-left:1rem;margin-right:1rem}
.photo-sec .card .add{display:block}
/* category pages: minimal slider + grid below */
.has-grid .car .track{gap:.9rem}
.has-grid .car .card{flex-basis:calc((100% - 2.7rem)/4)}
.has-grid .car .pic{aspect-ratio:4/5}
.has-grid .car .nm{font-size:.8rem;margin-top:.6rem}
.has-grid .car .vr,.has-grid .car .pr{font-size:.78rem;line-height:1.4}
.has-grid .car .add{font-size:.72rem}
.has-grid .car .pic .stock{font-size:.66rem;left:.5rem;bottom:.5rem}
.has-grid .car .heart{top:.6rem;right:.6rem;width:1.3rem;height:1.3rem}
.gridsec{margin-top:clamp(3rem,7vw,5.5rem)}
@media (max-width:900px){.has-grid .car .card{flex-basis:calc((100% - .9rem)/2)}}
@media (max-width:520px){.has-grid .car .card{flex-basis:70%}}
/* stock pill inside the picture */
.pic .stock{position:absolute;left:.7rem;bottom:.7rem;margin:0;z-index:2;pointer-events:none;background:transparent;color:#222;border:0;padding:0;font-weight:400;text-shadow:0 0 6px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.8);transition:bottom .4s cubic-bezier(.2,.8,.2,1)}
.pic .stock.low,.pic .stock.out{color:#222;border:0}
.admin .pic .stock{bottom:5.6rem}
/* stock +/- */
.adm .stk{display:inline-flex;align-items:center;gap:.25rem;background:#2a2a29;color:#fff;font-size:.68rem;letter-spacing:.05em;padding:.2rem .4rem}
.adm .stk button{padding:.1rem .55rem;font-size:.95rem;line-height:1.2;background:#f4f4f2;color:#2a2a29}
.adm .stk b{min-width:1.6rem;text-align:center;font-weight:500;font-size:.8rem}
#atot{margin:0 1rem 0 -.2rem;opacity:.85;display:inline-block;padding-right:1rem;border-right:1px solid #6d6d69}
/* staff mode transition */
#curtain{position:fixed;inset:0;z-index:200;background:#2a2a29;color:#f4f4f2;display:flex;align-items:center;justify-content:center;pointer-events:none;transform:translateY(101%);visibility:hidden}
#curtain span{font-weight:200;font-size:clamp(1.6rem,5vw,3rem);letter-spacing:.3em;text-transform:uppercase;opacity:0}
#curtain.sweep{visibility:visible;animation:sweep 1s cubic-bezier(.65,0,.35,1) both}
#curtain.sweep span{animation:cwd 1s ease both}
@keyframes sweep{0%{transform:translateY(101%)}42%,58%{transform:translateY(0)}100%{transform:translateY(-101%)}}
@keyframes cwd{0%,25%{opacity:0;transform:translateY(14px)}42%,58%{opacity:1;transform:none}75%,100%{opacity:0}}
@keyframes abIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
#abar.in{animation:abIn .6s .45s cubic-bezier(.2,.8,.2,1) both}
.admin .adm{animation:rise .55s .55s cubic-bezier(.2,.8,.2,1) both}
.admin .logo{animation:dashin .6s .5s both}
@keyframes dashin{from{outline-color:transparent}to{outline-color:#2a2a29}}

/* ---------- orders ---------- */
var OK_='jcl_orders',OB_='jcl_outbox',KK_='jcl_okey',STAT=['New','Packed','Shipped','Completed','Cancelled'];
var ORD=[],known=null,poll=null,ofilter='All',cloudMsg='';
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function okey(){try{return localStorage.getItem(KK_)||''}catch(e){return ''}}
function oid(){return 'JCL-'+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,5).toUpperCase()}
function oFmt(o){try{return new Date(o.ts).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}catch(e){return new Date(o.ts).toLocaleString()}}
function cpost(o){return fetch(tx.ep,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)})}
function cget(){return fetch(tx.ep+(tx.ep.indexOf('?')<0?'?':'&')+'action=list&key='+encodeURIComponent(okey())).then(function(r){return r.json()})}
function queue(o){var q=jget(OB_,[]);q.push(o);jset(OB_,q)}
function flushOutbox(){var b=jget(OB_,[]);if(!tx.ep||!b.length)return;jset(OB_,[]);b.forEach(function(o){cpost({action:'new',order:o}).catch(function(){queue(o)})})}
function sendOrder(o){
  var a=jget(OK_,[]);a.unshift(o);jset(OK_,a.slice(0,200));
  if(!tx.ep)return Promise.resolve();
  return cpost({action:'new',order:o}).catch(function(){queue(o)})}
function checkout(){
  var m=$('cmsg');
  if(!cart.length){m.textContent='Your bag is empty.';return}
  if($('chko'))return;
  var u=getUser()||{},total=Math.round(cart.reduce(function(a,x){return a+x.price*x.qty},0)*100)/100,n=cart.reduce(function(a,x){return a+x.qty},0);
  var d=document.createElement('div');d.id='chko';
  d.innerHTML='<form class="chf" novalidate><h2>Checkout</h2><p class="chs">'+n+(n===1?' item':' items')+' · '+money(total)+'</p>'+
    '<label>Full name<input name="c_name" autocomplete="name"></label>'+
    '<label>Mobile number<input name="c_phone" type="tel" autocomplete="tel"></label>'+
    '<label>Email (optional)<input name="c_email" type="email" autocomplete="email"></label>'+
    '<label>Delivery address<textarea name="c_addr" autocomplete="street-address"></textarea></label>'+
    '<label>Payment<select name="c_pay"><option>Cash on delivery</option><option>GCash</option><option>Bank transfer</option></select></label>'+
    '<label>Note (optional)<textarea name="c_notes"></textarea></label>'+
    '<div class="cer" role="alert"></div><div class="row"><button type="button" class="bk">Back</button><button type="submit" class="pri">Place order</button></div></form>';
  document.body.appendChild(d);
  var f=d.querySelector('form'),er=d.querySelector('.cer'),v=function(k){return f.elements[k].value.trim()};
  f.elements.c_name.value=u.name||'';f.elements.c_email.value=u.email||'';f.elements.c_name.focus();
  d.querySelector('.bk').onclick=function(){d.remove()};
  d.addEventListener('mousedown',function(e){if(e.target===d)d.remove()});
  f.onsubmit=function(e){e.preventDefault();
    if(!v('c_name')){er.textContent='Please enter your name.';return}
    if(v('c_phone').replace(/\D/g,'').length<7){er.textContent='Please enter a valid mobile number.';return}
    if(v('c_email')&&!/^\S+@\S+\.\S+$/.test(v('c_email'))){er.textContent='That email address does not look right.';return}
    if(v('c_addr').length<8){er.textContent='Please enter your full delivery address.';return}

      items:cart.map(function(x){return {name:x.name,sub:x.sub,qty:x.qty,price:x.price}}),total:total};
    sendOrder(o).then(function(){cart=[];cartUpdate();d.remove();m.textContent='Thank you! Your order '+o.id+' has been placed.'})}}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(function(){o.stop();c.close()},220)}catch(e){}}
function upBadge(){var n=ORD.filter(function(o){return o.status==='New'}).length,b=$('obadge'),a=$('aord');if(b)b.textContent=n?'('+n+' new)':'';if(a)a.classList.toggle('hot',n>0)}
function refreshOrders(){
  var p=tx.ep?cget().then(function(j){
      if(j&&j.ok){cloudMsg='';return j.orders||[]}
      cloudMsg=(j&&j.error==='unauthorized')?'Your Orders key is missing or wrong. Press Setup and enter it.':'The orders connection returned an error. Press Setup to check it.';return []})
    .catch(function(){cloudMsg='Could not reach your orders link. Check your internet connection and the link in Setup.';return []}):Promise.resolve(null);
  return p.then(function(cl){
    if(!tx.ep)cloudMsg='';
    var m={};jget(OK_,[]).forEach(function(o){m[o.id]=o});(cl||[]).forEach(function(o){m[o.id]=o});
    ORD=Object.keys(m).map(function(k){var o=m[k];o.status=o.status||'New';o.ts=+o.ts||0;return o}).sort(function(a,b){return b.ts-a.ts});
    var fresh=known?ORD.filter(function(o){return !known[o.id]}):[];
    known=known||{};ORD.forEach(function(o){known[o.id]=1});
    if(fresh.length){flash('New order received! ('+fresh.length+')',6000);beep()}
    upBadge();if($('ordp'))drawOrders()})}
function ordWatch(a){clearInterval(poll);if(a){known=null;refreshOrders();poll=setInterval(refreshOrders,20000)}else{closeOrders();ORD=[];known=null;upBadge()}}
function ocard(o){
  var its=(o.items||[]).map(function(x){return '<li><span>'+(+x.qty||0)+' × '+esc(x.name)+'<small>'+esc(x.sub||'')+'</small></span><span>'+money((+x.price||0)*(+x.qty||0))+'</span></li>'}).join('');

    '<div><b>'+esc(o.name)+'</b> · <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a>'+(o.email?' · '+esc(o.email):'')+'</div><div class="ad">'+esc(o.address||'')+'</div>'+
    '<div>'+esc(o.pay||'')+(o.notes?' · Note: '+esc(o.notes):'')+'</div><ul>'+its+'</ul><div class="o4"><b>Total '+money(+o.total||0)+'</b><button type="button" class="od">Delete</button></div></div>'}
function drawOrders(){
  var b=$('o-b'),t=$('o-t');if(!b)return;
  var cnt={All:ORD.length};STAT.forEach(function(s){cnt[s]=ORD.filter(function(o){return o.status===s}).length});
  t.innerHTML=['All'].concat(STAT).map(function(s){return '<button type="button" data-f="'+s+'"'+(s===ofilter?' class="on"':'')+'>'+s+' ('+cnt[s]+')</button>'}).join('');
  t.querySelectorAll('button').forEach(function(x){x.onclick=function(){ofilter=x.getAttribute('data-f');drawOrders()}});
  var h='';
  if(!tx.ep)h+='<div class="onote"><b>Orders are saved on this device only.</b> To receive orders from your customers’ phones, press Setup and connect your Google Sheet.</div>';
  else if(cloudMsg)h+='<div class="onote">'+esc(cloudMsg)+'</div>';
  var L=ORD.filter(function(o){return ofilter==='All'||o.status===ofilter});
  b.innerHTML=h+(L.length?L.map(ocard).join(''):'<p class="oempty">No orders here yet.</p>')}
function setStatus(id,s){
  ORD.forEach(function(o){if(o.id===id)o.status=s});
  var l=jget(OK_,[]);l.forEach(function(o){if(o.id===id)o.status=s});jset(OK_,l);
  if(tx.ep)cpost({action:'status',key:okey(),id:id,status:s}).catch(function(){flash('Could not update online. Please try again.',4000)});
  upBadge();drawOrders()}
function delOrder(id){
  if(!confirm('Delete order '+id+'? This cannot be undone.'))return;
  ORD=ORD.filter(function(o){return o.id!==id});
  jset(OK_,jget(OK_,[]).filter(function(o){return o.id!==id}));
  if(tx.ep)cpost({action:'delete',key:okey(),id:id}).catch(function(){flash('Could not delete online. Please try again.',4000)});
  upBadge();drawOrders()}
function exportCsv(){
  var rows=[['Order','Date','Status','Name','Phone','Email','Address','Payment','Notes','Items','Total']];
  ORD.forEach(function(o){rows.push([o.id,oFmt(o),o.status,o.name,o.phone,o.email,o.address,o.pay,o.notes,(o.items||[]).map(function(x){return x.qty+'x '+x.name+' ('+(x.sub||'')+')'}).join('; '),o.total])});
  var csv=rows.map(function(r){return r.map(function(v){v=v==null?'':String(v);if(/^[=@]/.test(v)||/^[+\-][^0-9]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='JCL_orders.csv';document.body.appendChild(a);a.click();a.remove()}
